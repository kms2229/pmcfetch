# Publishes to PyPI when a GitHub release is published, via PyPI trusted
# publishing (no API token stored anywhere). Tag releases as v<version>, e.g.
# v0.1.0, matching __version__ in src/pmcfetch/__init__.py.
name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: python -m pip install build
      - run: python -m build
      - name: Check the release tag matches the package version
        run: |
          if [ ! -f "dist/pmcfetch-${GITHUB_REF_NAME#v}.tar.gz" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match the built version: $(ls dist)"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pmcfetch
    permissions:
      id-token: write  # lets PyPI verify this workflow instead of a token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
