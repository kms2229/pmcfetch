[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmcfetch"
dynamic = ["version"]
description = "Targeted PDF retrieval from the PMC Open Access Subset on AWS. Zero dependencies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kavach Shah" }]
requires-python = ">=3.10"
keywords = ["pubmed-central", "pmc", "open-access", "bulk-download", "bioinformatics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Text Processing :: Indexing",
  "Typing :: Typed",
]
# Stdlib only — S3 Open Access is anonymous HTTPS.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/kms2229/pmcfetch"
Source = "https://github.com/kms2229/pmcfetch"
Issues = "https://github.com/kms2229/pmcfetch/issues"
Changelog = "https://github.com/kms2229/pmcfetch/blob/main/CHANGELOG.md"

[project.scripts]
pmcfetch = "pmcfetch.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pmcfetch = ["py.typed"]

[tool.setuptools.dynamic]
# Single source of truth: pmcfetch.__version__ (also used in the User-Agent).
version = { attr = "pmcfetch.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
